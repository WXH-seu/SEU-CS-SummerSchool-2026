<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1050" viewBox="0 0 1520 1050" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 0 L 0 5 L 9 10 L 6 5 Z" fill="#2c3e50"/>
    </marker>
    <style>
      .life { stroke:#9aaec3; stroke-width:1.2; stroke-dasharray:4 4; }
      .box { fill:#e8eef7; stroke:#455a75; stroke-width:1.3; }
      .boxText { font-size:13px; font-weight:bold; fill:#1d2b3a; }
      .boxType { font-size:10.5px; fill:#6b7d92; }
      .frame { fill:none; stroke:#8aa0b8; stroke-width:1.3; }
      .frameTitle { font-size:14px; font-weight:bold; fill:#2c3e50; }
      .msg { stroke:#2c3e50; stroke-width:1.4; fill:none; }
      .msgRet { stroke:#5b7292; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
      .msgLabel { font-size:11.5px; fill:#2c3e50; }
      .msgLabelRet { font-size:11.5px; fill:#5b7292; }
      .act { fill:#dbe6f2; stroke:#8095ab; stroke-width:1; }
      .note { font-size:11.5px; fill:#7a8ba0; }
    </style>
  </defs>

  <!-- 参与者小标题（可选）：用横排 lifeline -->
  <!-- Participant lifelines -->
  <!-- Client -->
  <rect class="box" x="70" y="30" width="120" height="54"/>
  <text class="boxText" x="130" y="52" text-anchor="middle">Client</text>
  <text class="boxType" x="130" y="68" text-anchor="middle">Swing / UserClientService</text>
  <path class="life" d="M130 84 L130 1010"/>
  <!-- ClientConnection -->
  <rect class="box" x="240" y="30" width="150" height="54"/>
  <text class="boxText" x="315" y="52" text-anchor="middle">ClientConnection</text>
  <text class="boxType" x="315" y="68" text-anchor="middle">网络层</text>
  <path class="life" d="M315 84 L315 1010"/>
  <!-- ClientHandler -->
  <rect class="box" x="420" y="30" width="150" height="54"/>
  <text class="boxText" x="495" y="52" text-anchor="middle">ClientHandler</text>
  <text class="boxType" x="495" y="68" text-anchor="middle">服务端连接线程</text>
  <path class="life" d="M495 84 L495 1010"/>
  <!-- RequestDispatcher -->
  <rect class="box" x="600" y="30" width="170" height="54"/>
  <text class="boxText" x="685" y="52" text-anchor="middle">RequestDispatcher</text>
  <text class="boxType" x="685" y="68" text-anchor="middle">认证+授权+分发</text>
  <path class="life" d="M685 84 L685 1010"/>
  <!-- AuthService -->
  <rect class="box" x="790" y="30" width="140" height="54"/>
  <text class="boxText" x="860" y="52" text-anchor="middle">AuthService</text>
  <text class="boxType" x="860" y="68" text-anchor="middle">业务服务</text>
  <path class="life" d="M860 84 L860 1010"/>
  <!-- AccessUserRepository -->
  <rect class="box" x="970" y="30" width="170" height="54"/>
  <text class="boxText" x="1055" y="52" text-anchor="middle">AccessUserRepository</text>
  <text class="boxType" x="1055" y="68" text-anchor="middle">DAO（Access）</text>
  <path class="life" d="M1055 84 L1055 1010"/>
  <!-- SessionRegistry -->
  <rect class="box" x="1170" y="30" width="150" height="54"/>
  <text class="boxText" x="1245" y="52" text-anchor="middle">SessionRegistry</text>
  <text class="boxType" x="1245" y="68" text-anchor="middle">内存会话</text>
  <path class="life" d="M1245 84 L1245 1010"/>
  <!-- PermissionPolicy -->
  <rect class="box" x="1340" y="30" width="160" height="54"/>
  <text class="boxText" x="1420" y="52" text-anchor="middle">PermissionPolicy</text>
  <text class="boxType" x="1420" y="68" text-anchor="middle">权限矩阵</text>
  <path class="life" d="M1420 84 L1420 1010"/>

  <!-- ===================== 登录场景 ===================== -->
  <rect class="frame" x="20" y="104" width="1480" height="502" rx="6"/>
  <text class="frameTitle" x="40" y="132">「登录」—— 公开操作，免会话（省略：HTTP 端口/密码校验细节已抽象）</text>

  <!-- activations -->
  <rect class="act" x="310" y="142" width="10" height="454"/>
  <rect class="act" x="490" y="216" width="10" height="288"/>
  <rect class="act" x="680" y="216" width="10" height="288"/>
  <rect class="act" x="855" y="258" width="10" height="204"/>
  <rect class="act" x="1050" y="298" width="10" height="40"/>
  <rect class="act" x="1240" y="378" width="10" height="40"/>

  <path class="msg" d="M130 168 L306 168" marker-end="url(#call)"/>
  <text class="msgLabel" x="215" y="162" text-anchor="middle">login(userId, password)</text>

  <path class="msg" d="M315 208 L486 208" marker-end="url(#call)"/>
  <text class="msgLabel" x="400" y="202" text-anchor="middle">writeObject( RequestMessage(USER_LOGIN) )</text>

  <path class="msg" d="M495 248 L676 248" marker-end="url(#call)"/>
  <text class="msgLabel" x="585" y="242" text-anchor="middle">dispatch(request)</text>

  <path class="msg" d="M685 288 L850 288" marker-end="url(#call)"/>
  <text class="msgLabel" x="770" y="282" text-anchor="middle">login(LoginRequest)</text>

  <path class="msg" d="M860 328 L1045 328" marker-end="url(#call)"/>
  <text class="msgLabel" x="955" y="322" text-anchor="middle">findById(userId)</text>

  <path class="msgRet" d="M1055 356 L870 356" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="960" y="350" text-anchor="middle">UserAccount</text>

  <path class="msg" d="M860 396 L1235 396" marker-end="url(#call)"/>
  <text class="msgLabel" x="1050" y="390" text-anchor="middle">create(account) → token</text>

  <path class="msgRet" d="M1245 424 L870 424" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="1055" y="418" text-anchor="middle">sessionToken</text>

  <path class="msgRet" d="M860 452 L695 452" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="780" y="446" text-anchor="middle">LoginResponse(token,userId,displayName,role)</text>

  <path class="msgRet" d="M685 480 L505 480" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="595" y="474" text-anchor="middle">ResponseMessage( SUCCESS, LoginResponse )</text>

  <path class="msgRet" d="M495 508 L325 508" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="410" y="502" text-anchor="middle">response</text>

  <path class="msgRet" d="M315 536 L140 536" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="228" y="530" text-anchor="middle">LoginResponse → 打开主界面</text>

  <!-- ===================== 权限检查场景 ===================== -->
  <rect class="frame" x="20" y="630" width="1480" height="378" rx="6"/>
  <text class="frameTitle" x="40" y="658">「受保护请求」—— 会话 + 角色校验（示例：学生调用 USER_LIST_QUERY 被拒）</text>

  <rect class="act" x="310" y="672" width="10" height="304"/>
  <rect class="act" x="490" y="718" width="10" height="248"/>
  <rect class="act" x="680" y="718" width="10" height="248"/>
  <rect class="act" x="1240" y="790" width="10" height="30"/>
  <rect class="act" x="1415" y="848" width="10" height="30"/>

  <path class="msg" d="M130 698 L306 698" marker-end="url(#call)"/>
  <text class="msgLabel" x="215" y="692" text-anchor="middle">RequestMessage(USER_LIST_QUERY, token)</text>

  <path class="msg" d="M315 738 L486 738" marker-end="url(#call)"/>
  <text class="msgLabel" x="400" y="732" text-anchor="middle">writeObject( ... )</text>

  <path class="msg" d="M495 778 L676 778" marker-end="url(#call)"/>
  <text class="msgLabel" x="585" y="772" text-anchor="middle">dispatch(request)</text>

  <path class="msg" d="M685 818 L1235 818" marker-end="url(#call)"/>
  <text class="msgLabel" x="900" y="812" text-anchor="middle">find(sessionToken) → 会话有效？</text>

  <path class="msgRet" d="M1245 838 L695 838" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="950" y="832" text-anchor="middle">UserAccount(role=STUDENT)</text>

  <path class="msg" d="M685 868 L1410 868" marker-end="url(#call)"/>
  <text class="msgLabel" x="1000" y="862" text-anchor="middle">allows(USER_LIST_QUERY, STUDENT)</text>

  <path class="msgRet" d="M1420 888 L695 888" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="1000" y="882" text-anchor="middle">false（仅 ADMIN）</text>

  <path class="msgRet" d="M685 916 L505 916" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="595" y="910" text-anchor="middle">ResponseMessage( FORBIDDEN, “您没有权限执行该操作” )</text>

  <path class="msgRet" d="M495 944 L325 944" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="410" y="938" text-anchor="middle">response</text>

  <path class="msgRet" d="M315 962 L140 962" marker-end="url(#call)"/>
  <text class="msgLabelRet" x="228" y="956" text-anchor="middle">ClientServiceException → “无权限”提示</text>

  <!-- 说明 -->
  <text class="note" x="40" y="1035">要点：认证（会话）与授权（角色）分离；顺序固定为 公开→会话→角色→业务；异常统一收口为稳定 ResponseCode。</text>
</svg>
